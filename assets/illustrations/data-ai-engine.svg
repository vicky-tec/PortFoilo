<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Data-to-AI Engine</title>
  <desc id="desc">A premium isometric machine showing raw data entering a processing line, a dominant AI core, and a connected analytics dashboard.</desc>
  <defs>
    <style>
      .flow-motion { display: none; }
      @media (prefers-reduced-motion: no-preference) {
        .flow-motion { display: inline; }
      }
    </style>
    <linearGradient id="deck" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#14233a"/><stop offset="1" stop-color="#070d18"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#304667"/><stop offset="1" stop-color="#17263e"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1b2d48"/><stop offset="1" stop-color="#0b1424"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1a2941"/><stop offset="1" stop-color="#09111f"/>
    </linearGradient>
    <linearGradient id="coreTop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6843a4"/><stop offset="1" stop-color="#29255c"/>
    </linearGradient>
    <linearGradient id="coreFront" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#35275d"/><stop offset="1" stop-color="#17152f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102b43"/><stop offset="1" stop-color="#07121f"/>
    </linearGradient>
    <pattern id="deckGrid" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="skewY(-18)">
      <path d="M28 0H0V28" fill="none" stroke="#53bde8" stroke-opacity=".09"/>
    </pattern>
  </defs>

  <!-- grounded platform -->
  <path d="m70 366 390-146 680 74-390 151Z" fill="#030811" stroke="#1b304b" stroke-width="3"/>
  <path d="m70 366 390-146v26L70 394Z" fill="#0b1627" stroke="#1b304b" stroke-width="3"/>
  <path d="m460 220 680 74v27l-680-75Z" fill="#101d31" stroke="#1b304b" stroke-width="3"/>
  <path d="m118 359 342-128 616 67-346 128Z" fill="url(#deck)" stroke="#2b4667" stroke-width="2"/>
  <path d="m118 359 342-128 616 67-346 128Z" fill="url(#deckGrid)"/>
  <path d="m168 374 286-106 548 59" fill="none" stroke="#1bc4f8" stroke-opacity=".22" stroke-width="2"/>

  <!-- raw data intake: compact cylinder and feeder -->
  <g stroke-linejoin="round">
    <path d="m150 204 92-34 115 20-92 38Z" fill="url(#top)" stroke="#486a91" stroke-width="3"/>
    <path d="m150 204v83l115 23v-82Z" fill="url(#front)" stroke="#486a91" stroke-width="3"/>
    <path d="m265 228 92-38v83l-92 37Z" fill="url(#side)" stroke="#486a91" stroke-width="3"/>
    <ellipse cx="242" cy="204" rx="92" ry="34" fill="#172841" stroke="#6c91bb" stroke-width="3"/>
    <ellipse cx="242" cy="204" rx="61" ry="20" fill="#071422" stroke="#1bc4f8" stroke-width="3"/>
    <path d="M202 201h80M213 211h58" stroke="#b9efff" stroke-opacity=".8" stroke-width="4"/>
    <path d="M174 253h65M174 270h47" stroke="#9db9d6" stroke-opacity=".65" stroke-width="5"/>
    <path d="m357 226 76-21 52 7-76 24Z" fill="#27466a" stroke="#5a83aa" stroke-width="3"/>
    <path d="m409 236 76-24v23l-76 25Z" fill="#13243a" stroke="#4d739b" stroke-width="3"/>
  </g>

  <!-- processing station -->
  <g stroke-linejoin="round">
    <path d="m387 182 111-42 147 25-112 45Z" fill="url(#top)" stroke="#507194" stroke-width="3"/>
    <path d="m387 182v87l146 27v-86Z" fill="url(#front)" stroke="#507194" stroke-width="3"/>
    <path d="m533 213 112-48v87l-112 44Z" fill="url(#side)" stroke="#507194" stroke-width="3"/>
    <path d="m421 204 72-27 87 15-73 29Z" fill="#081525" stroke="#1bc4f8" stroke-opacity=".7" stroke-width="3"/>
    <path d="M441 201h35M441 214h61M441 227h43" stroke="#bbdff7" stroke-opacity=".75" stroke-width="4"/>
    <path d="m597 201 25-10v15l-25 10ZM597 226l25-10v15l-25 10ZM597 251l25-10v15l-25 10Z" fill="#1bc4f8"/>
  </g>

  <!-- dominant AI core -->
  <g stroke-linejoin="round">
    <path d="m586 113 150-57 208 39-152 62Z" fill="url(#coreTop)" stroke="#a47be5" stroke-width="4"/>
    <path d="m586 113v164l206 39V157Z" fill="url(#coreFront)" stroke="#8b65c9" stroke-width="4"/>
    <path d="m792 157 152-62v163l-152 58Z" fill="#1f1942" stroke="#7256ad" stroke-width="4"/>
    <path d="m635 137 102-38 128 24-103 41Z" fill="#0a1020" stroke="#d4b6ff" stroke-opacity=".75" stroke-width="3"/>
    <path d="M666 135h40M666 149h67M770 125h51" stroke="#eadcff" stroke-width="5"/>
    <rect x="642" y="184" width="112" height="58" rx="8" fill="#11132d" stroke="#a855f7" stroke-opacity=".75" stroke-width="3"/>
    <path d="M658 203h79M658 219h51" stroke="#c6a6ff" stroke-width="5"/>
    <circle cx="836" cy="193" r="11" fill="#1bc4f8"/>
    <circle cx="836" cy="229" r="11" fill="#a855f7"/>
    <circle cx="836" cy="265" r="11" fill="#3b82f6"/>
    <path d="M836 204v14M836 240v14" stroke="#e5d7ff" stroke-width="3"/>
    <path d="M618 269h78M618 286h111" stroke="#8d6bc1" stroke-width="5"/>
  </g>

  <!-- enlarged analytics monitor -->
  <g stroke-linejoin="round">
    <path d="m885 145 142-54 152 28-143 60Z" fill="#2c4567" stroke="#6686ae" stroke-width="3"/>
    <path d="m885 145v128l151 30V179Z" fill="url(#front)" stroke="#6686ae" stroke-width="3"/>
    <path d="m1036 179 143-60v129l-143 55Z" fill="url(#side)" stroke="#6686ae" stroke-width="3"/>
    <path d="m912 161 111-25 103 20-111 30Z" fill="url(#screen)" stroke="#1bc4f8" stroke-opacity=".7" stroke-width="3"/>
    <path d="M934 201v48M958 193v56M982 201v48M1006 186v63" stroke="#1bc4f8" stroke-opacity=".72" stroke-width="11"/>
    <path d="m1063 198 66-25M1063 225l85-34M1063 252l55-22" stroke="#a855f7" stroke-width="7"/>
    <path d="m933 261 49-18 38 8 52-27" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="3"/>
    <path d="m1000 303 42 8v36l-42-8ZM1042 311l45-17v37l-45 16Z" fill="#1a2a43" stroke="#6686ae" stroke-width="3"/>
    <path d="m967 342 75 15 65-25" fill="none" stroke="#6686ae" stroke-width="5"/>
  </g>

  <!-- connected pipelines -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M356 224c35-25 45-25 78-21 28 4 43-11 60-26" stroke="#0a1626" stroke-width="16"/>
    <path d="M356 224c35-25 45-25 78-21 28 4 43-11 60-26" stroke="#1bc4f8" stroke-width="7"/>
    <path d="M650 183c34-23 52-24 84-10 29 13 49 10 76-10" stroke="#0a1626" stroke-width="17"/>
    <path d="M650 183c34-23 52-24 84-10 29 13 49 10 76-10" stroke="#a855f7" stroke-width="7"/>
    <path d="M941 173c29-7 50-4 71 12 28 21 46 21 73 7" stroke="#0a1626" stroke-width="17"/>
    <path d="M941 173c29-7 50-4 71 12 28 21 46 21 73 7" stroke="#3b82f6" stroke-width="7"/>
    <path d="M356 224c35-25 45-25 78-21 28 4 43-11 60-26M650 183c34-23 52-24 84-10 29 13 49 10 76-10M941 173c29-7 50-4 71 12 28 21 46 21 73 7" stroke="#e3faff" stroke-opacity=".58" stroke-width="2"/>
    <g class="flow-motion" aria-hidden="true">
      <circle r="6" fill="#fff">
        <animateMotion dur="2.6s" repeatCount="indefinite" path="M356 224c35-25 45-25 78-21 28 4 43-11 60-26"/>
      </circle>
      <circle r="6" fill="#fff">
        <animateMotion dur="2.9s" begin=".7s" repeatCount="indefinite" path="M650 183c34-23 52-24 84-10 29 13 49 10 76-10"/>
      </circle>
      <circle r="6" fill="#fff">
        <animateMotion dur="3.1s" begin="1.3s" repeatCount="indefinite" path="M941 173c29-7 50-4 71 12 28 21 46 21 73 7"/>
      </circle>
    </g>
  </g>

  <!-- restrained floating nodes and grounding accents -->
  <g stroke="#a9eaff" stroke-width="2">
    <circle cx="452" cy="120" r="7" fill="#1bc4f8"/>
    <circle cx="474" cy="104" r="5" fill="#3b82f6"/>
    <circle cx="1012" cy="75" r="6" fill="#a855f7"/>
    <path d="M452 120 500 86M1012 75l46 30" fill="none" stroke-opacity=".55"/>
  </g>
  <path d="m548 412 106 12 116-28" fill="none" stroke="#1bc4f8" stroke-opacity=".18" stroke-width="5"/>
</svg>
