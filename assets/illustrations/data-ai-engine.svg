<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Data-to-AI Engine</title>
  <desc id="desc">An isometric machine showing data intake, cleaning, Python and machine learning processing, and an analytics dashboard.</desc>
  <defs>
    <style>
      .flow-motion { display: none; }
      @media (prefers-reduced-motion: no-preference) {
        .flow-motion { display: inline; }
      }
    </style>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182235"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="surface2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263654"/>
      <stop offset="1" stop-color="#11182a"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1bc4f8"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2032"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1bc4f8" stroke-opacity=".08"/>
    </pattern>
  </defs>

  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M102 390 420 270l666 74-320 128Z" fill="#07101d" stroke="#20304a" stroke-width="3"/>
    <path d="m102 390 318-120v34L102 424Z" fill="#0c1727" stroke="#20304a" stroke-width="3"/>
    <path d="m420 270 666 74v34l-666-74Z" fill="#111b2c" stroke="#20304a" stroke-width="3"/>
    <path d="M150 374 420 274l600 68-270 103Z" fill="url(#grid)" opacity=".7"/>

    <!-- Data intake module -->
    <path d="m158 190 112-42 154 27-112 48Z" fill="#243754" stroke="#44648b" stroke-width="3"/>
    <path d="m158 190v112l154 29V223Z" fill="url(#surface)" stroke="#44648b" stroke-width="3"/>
    <path d="m312 223 112-48v114l-112 42Z" fill="url(#surface2)" stroke="#44648b" stroke-width="3"/>
    <ellipse cx="270" cy="190" rx="112" ry="42" fill="#15233a" stroke="#5a7ea8" stroke-width="3"/>
    <ellipse cx="270" cy="190" rx="78" ry="25" fill="#081422" stroke="#1bc4f8" stroke-opacity=".7" stroke-width="3"/>
    <path d="M214 181h112M226 193h88M240 205h62" stroke="#1bc4f8" stroke-opacity=".7" stroke-width="5"/>
    <path d="M184 258h92M184 276h68" stroke="#a7c6e8" stroke-opacity=".55" stroke-width="5"/>
    <text x="192" y="334" fill="#cfe8ff" stroke="none" font-family="Space Grotesk,Arial,sans-serif" font-size="18" letter-spacing="2">RAW DATA</text>

    <!-- Cleaning module -->
    <path d="m382 214 130-46 160 30-130 51Z" fill="#233957" stroke="#44648b" stroke-width="3"/>
    <path d="m382 214v108l160 28V249Z" fill="url(#surface)" stroke="#44648b" stroke-width="3"/>
    <path d="m542 249 130-51v113l-130 39Z" fill="url(#surface2)" stroke="#44648b" stroke-width="3"/>
    <path d="m416 241 74-22 86 15-75 24Z" fill="#0b1a2b" stroke="#1bc4f8" stroke-opacity=".6" stroke-width="2"/>
    <path d="M432 257h92M432 275h62M432 293h78" stroke="#b8d5ef" stroke-opacity=".55" stroke-width="5"/>
    <path d="m608 231 27-10v16l-27 10ZM608 258l27-10v16l-27 10ZM608 285l27-10v16l-27 10Z" fill="#1bc4f8" stroke="none"/>
    <text x="420" y="369" fill="#cfe8ff" stroke="none" font-family="Space Grotesk,Arial,sans-serif" font-size="17" letter-spacing="1.6">CLEAN / SHAPE</text>

    <!-- Python / ML / AI core -->
    <path d="m585 150 130-48 185 34-132 55Z" fill="#29365d" stroke="#5b6ca9" stroke-width="3"/>
    <path d="m585 150v141l183 35V191Z" fill="url(#surface)" stroke="#5b6ca9" stroke-width="3"/>
    <path d="m768 191 132-55v142l-132 48Z" fill="url(#surface2)" stroke="#5b6ca9" stroke-width="3"/>
    <path d="m622 174 77-28 102 19-79 29Z" fill="#0a1422" stroke="#a855f7" stroke-opacity=".85" stroke-width="3"/>
    <path d="M641 171h45M641 184h28M714 166h57" stroke="#d9c3ff" stroke-width="4"/>
    <path d="M627 222h92M627 242h116M627 262h74" stroke="#8bcfff" stroke-opacity=".65" stroke-width="5"/>
    <circle cx="837" cy="196" r="10" fill="#1bc4f8" stroke="none"/>
    <circle cx="837" cy="231" r="10" fill="#a855f7" stroke="none"/>
    <circle cx="837" cy="266" r="10" fill="#3b82f6" stroke="none"/>
    <path d="M837 206v15M837 241v15" stroke="#d5e8ff" stroke-width="3"/>
    <text x="633" y="326" fill="#ffffff" stroke="none" font-family="Space Grotesk,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.6">PYTHON / ML / AI</text>

    <!-- Analytics monitor -->
    <path d="m858 165 156-59 172 35-157 64Z" fill="#263a58" stroke="#5b759d" stroke-width="3"/>
    <path d="m858 165v135l171 33V205Z" fill="#101b2d" stroke="#5b759d" stroke-width="3"/>
    <path d="m1029 205 157-64v137l-157 55Z" fill="#17253b" stroke="#5b759d" stroke-width="3"/>
    <path d="m889 180 126-29 127 27-126 37Z" fill="url(#screen)" stroke="#1bc4f8" stroke-opacity=".65" stroke-width="2"/>
    <path d="M910 221v50M938 210v61M966 218v53M994 199v72M1022 211v60" stroke="#1bc4f8" stroke-opacity=".55" stroke-width="10"/>
    <path d="m1080 217 48-20M1080 244l72-30M1080 271l50-20" stroke="#a855f7" stroke-width="6"/>
    <path d="m915 281 65-22 48 8 61-28" stroke="#ffffff" stroke-opacity=".75" stroke-width="3"/>
    <path d="m969 344 43 8v42l-43-8ZM1012 352l45-17v43l-45 16Z" fill="#18263b" stroke="#5b759d" stroke-width="3"/>
    <path d="m950 388 62 12 72-27" stroke="#5b759d" stroke-width="5"/>
    <text x="884" y="424" fill="#cfe8ff" stroke="none" font-family="Space Grotesk,Arial,sans-serif" font-size="17" letter-spacing="1.5">INSIGHT DASHBOARD</text>

    <!-- Data-flow channels -->
    <path id="flow-clean" d="M386 211c34-23 48-26 78-22 30 4 39-9 54-25" stroke="#1bc4f8" stroke-width="8"/>
    <path id="flow-model" d="M672 184c38-21 56-20 88-8 30 12 51 9 76-11" stroke="#a855f7" stroke-width="8"/>
    <path id="flow-insight" d="M900 191c38-7 54-4 77 12 29 20 49 19 77 3" stroke="#3b82f6" stroke-width="8"/>
    <path d="M386 211c34-23 48-26 78-22 30 4 39-9 54-25M672 184c38-21 56-20 88-8 30 12 51 9 76-11M900 191c38-7 54-4 77 12 29 20 49 19 77 3" stroke="#d8f7ff" stroke-opacity=".55" stroke-width="2"/>
    <g class="flow-motion" aria-hidden="true">
      <circle r="6" fill="#ffffff">
        <animateMotion dur="2.4s" repeatCount="indefinite" path="M386 211c34-23 48-26 78-22 30 4 39-9 54-25"/>
      </circle>
      <circle r="6" fill="#ffffff">
        <animateMotion dur="2.8s" begin=".8s" repeatCount="indefinite" path="M672 184c38-21 56-20 88-8 30 12 51 9 76-11"/>
      </circle>
      <circle r="6" fill="#ffffff">
        <animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M900 191c38-7 54-4 77 12 29 20 49 19 77 3"/>
      </circle>
    </g>
    <circle cx="420" cy="196" r="8" fill="#1bc4f8" stroke="none"/>
    <circle cx="716" cy="175" r="8" fill="#a855f7" stroke="none"/>
    <circle cx="946" cy="198" r="8" fill="#3b82f6" stroke="none"/>
  </g>
</svg>
